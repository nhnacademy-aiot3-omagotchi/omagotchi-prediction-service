name: Code Quality

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Pytest and SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # LightGBM이 요구하는 OpenMP 런타임. 러너 이미지의 사전 설치 여부에 의존하지 않는다.
      - name: Install OpenMP runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install dependencies
        shell: bash
        run: pip install -r requirements-dev.txt

      # 커버리지 하한 60%는 다른 서비스의 JaCoCo check 규칙과 같은 기준이다.
      - name: Run tests with coverage
        shell: bash
        run: pytest --cov=app --cov-report=xml --cov-fail-under=60

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
