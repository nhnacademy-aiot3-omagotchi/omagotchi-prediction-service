# SonarQube 분석 설정
# Java 서비스는 pom.xml의 sonar.* 속성으로 지정하지만, 이 서비스는 Maven을 쓰지 않아
# SonarScanner CLI가 읽는 이 파일에 같은 값을 둔다.

sonar.projectKey=aiot3-team5-omagotchi-prediction-service
sonar.projectName=aiot3-team5-omagotchi-prediction-service

sonar.sources=app
sonar.tests=tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
